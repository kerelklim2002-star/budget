/* ═══════════════════════════════════════════════════════
   FIFO-логика партий валюты: покупаем донги/доллары и т.п.
   отдельными партиями, каждая трата в этой валюте съедает
   партии по очереди — как только одна закончилась, дальше
   считаем по курсу следующей.
   ═══════════════════════════════════════════════════════ */
function effRate(lot) {
  // рублей за 1 единицу купленной валюты
  if (!lot.midCurrency || lot.midCurrency === "RUB") {
    // прямая покупка за рубли: rateDirect — сколько рублей за 1 единицу валюты (обычная котировка курса)
    return lot.rateDirect || 0;
  }
  // через промежуточную валюту (USD или CNY): rateMidRub — курс промежуточной к рублю,
  // rateCurPerMid — сколько купленной валюты за 1 единицу промежуточной
  return (lot.rateCurPerMid || 0) > 0 ? (lot.rateMidRub || 0) / lot.rateCurPerMid : 0;
}
function buildFifoIndex(purchases) {
  const byCur = {};
  [...purchases].filter(p=>p.currency!=="RUB").sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0))
    .forEach(p=>{
      if(!byCur[p.currency]) byCur[p.currency]=[];
      const cumFrom = byCur[p.currency].length ? byCur[p.currency][byCur[p.currency].length-1].cumTo : 0;
      byCur[p.currency].push({...p, cumFrom, cumTo: cumFrom + (p.amount||0), rate: effRate(p)});
    });
  return byCur;
}
function rateForSpend(currency, fifoIdx, cumSpentAfter) {
  const lots = fifoIdx[currency] || [];
  const lot = lots.find(l => l.cumTo >= cumSpentAfter);
  if (lot) return { rate: lot.rate, insufficient: false };
  const last = lots[lots.length-1];
  return { rate: last ? last.rate : 0, insufficient: true };
}
// Сколько единиц КОШЕЛЬКА "съедает" расход: если платили в той же валюте — 1:1,
// если платили в другой (напр. кошелёк $, оплата в донгах картой) — через введённый/подтянутый кросс-курс.
function walletAmount(e) {
  const wallet = e.walletCurrency || e.currency || "RUB";
  const spend = e.currency || "RUB";
  if (wallet === spend) return e.amount || 0;
  const rate = e.conversionRate || 0; // сколько spend-валюты за 1 единицу wallet-валюты
  return rate > 0 ? (e.amount || 0) / rate : 0;
}
// возвращает {id -> {rub, rate, insufficient}} для всех расходов, в порядке даты/создания
function buildRubMap(expenses, fifoIdx) {
  const order = [...expenses].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.createdAt||0)-(b.createdAt||0));
  const cum = {}; const map = {};
  order.forEach(e=>{
    const wallet = e.walletCurrency || e.currency || "RUB";
    if (wallet === "RUB") { map[e.id] = { rub: e.amount||0, rate: 1, insufficient:false }; return; }
    const wa = walletAmount(e);
    const before = cum[wallet] || 0;
    const after = before + wa;
    const r = rateForSpend(wallet, fifoIdx, after);
    cum[wallet] = after;
    map[e.id] = { rub: wa * r.rate, rate: r.rate, insufficient: r.insufficient };
  });
  return map;
}
function currencyBalance(currency, purchases, expenses) {
  const bought = purchases.filter(p=>p.currency===currency).reduce((s,p)=>s+(p.amount||0),0);
  const spent = expenses.filter(e=>(e.walletCurrency||e.currency)===currency).reduce((s,e)=>s+walletAmount(e),0);
  return { bought, spent, rest: bought - spent };
}
// РУБлёвая стоимость остатка кошелька — по курсу ПОКУПКИ ещё не потраченных партий (FIFO)
function walletRestRubValue(currency, purchases, spentTotal) {
  const idx = buildFifoIndex(purchases);
  const lots = idx[currency] || [];
  let rub = 0;
  lots.forEach(lot=>{
    let remaining;
    if (spentTotal <= lot.cumFrom) remaining = lot.amount;
    else if (spentTotal >= lot.cumTo) remaining = 0;
    else remaining = lot.cumTo - spentTotal;
    rub += remaining * lot.rate;
  });
  return rub;
}

function periodRange(period, from, to) {
  const today = todayStr();
  const d = new Date();
  if (period === "week") { const f = new Date(d); f.setDate(f.getDate()-6); return [f.toISOString().slice(0,10), today]; }
  if (period === "month") { const f = new Date(d.getFullYear(), d.getMonth(), 1); return [f.toISOString().slice(0,10), today]; }
  if (period === "quarter") { const f = new Date(d); f.setMonth(f.getMonth()-3); return [f.toISOString().slice(0,10), today]; }
  if (period === "year") { const f = new Date(d); f.setFullYear(f.getFullYear()-1); return [f.toISOString().slice(0,10), today]; }
  return [from || today, to || today];
}
function bucketKey(ds, format) {
  if (format === "day") return ds;
  if (format === "week") return `${new Date(ds).getFullYear()}-Н${wn(ds)}`;
  return ds.slice(0,7);
}
function bucketLabel(key, format) {
  if (format === "day") return new Date(key).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
  if (format === "week") return key.includes("-Н") ? key.split("-Н")[1] : key;
  return new Date(key+"-01").toLocaleDateString("ru-RU",{month:"short",year:"2-digit"});
}
function buildBuckets(expenses, format, getRub, from, to) {
  const m = {};
  expenses.forEach(e=>{ const k=bucketKey(e.date, format); m[k]=(m[k]||0)+getRub(e); });
  if (format === "day" && from && to) {
    // заполняем пропуски нулями, чтобы дни без трат тоже занимали своё место на графике
    let cur = new Date(from); const end = new Date(to);
    while (cur <= end) {
      const k = cur.toISOString().slice(0,10);
      if (!(k in m)) m[k] = 0;
      cur.setDate(cur.getDate()+1);
    }
  }
  return Object.keys(m).sort().map(k=>({key:k, label:bucketLabel(k,format), value:m[k]}));
}

/* ═══ Donut ═══ */
function Donut({slices,size=160,label,sub}){
  const tot=slices.reduce((s,x)=>s+x.value,0)||1;
  let cum=0;const r=56,cx=80,cy=80,sw=18,C=2*Math.PI*r;
  return(
    <svg width={size} height={size} viewBox="0 0 160 160">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--bg3)" strokeWidth={sw}/>
      {slices.map((sl,i)=>{const p=sl.value/tot,dash=p*C,off=-cum*C;cum+=p;
        return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={sl.color} strokeWidth={sw} strokeLinecap="round"
          strokeDasharray={`${dash} ${C-dash}`} strokeDashoffset={off}
          transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"all .7s cubic-bezier(.4,0,.2,1)"}}/>;
      })}
      <text x={cx} y={cy-3} textAnchor="middle" fill="var(--t1)" fontSize="18" fontWeight="800" fontFamily="'Inter',sans-serif">{label}</text>
      {sub&&<text x={cx} y={cy+15} textAnchor="middle" fill="var(--t3)" fontSize="11" fontFamily="'Inter',sans-serif">{sub}</text>}
    </svg>
  );
}

/* ═══ BubbleDonut — категории «плавающими» бабблами вокруг кольца (как у Spendee) ═══ */
function BubbleDonut({slices}){
  const tot=slices.reduce((s,x)=>s+x.value,0)||1;
  const cx=200,cy=200,r=85,sw=24,C=2*Math.PI*r,bubR=22,bubDist=r+40,labelDist=bubDist+bubR+20;
  let cum=0;
  const withMeta = slices.map(sl=>{
    const frac=sl.value/tot;
    const midFrac = cum+frac/2;
    cum+=frac;
    return {...sl, frac, angle: midFrac*2*Math.PI-Math.PI/2};
  });
  cum=0;
  return(
    <svg viewBox="0 0 400 400" width="100%" style={{maxWidth:380,display:"block",margin:"0 auto"}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--bg3)" strokeWidth={sw}/>
      {slices.map((sl,i)=>{const p=sl.value/tot,dash=p*C,off=-cum*C;cum+=p;
        return <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={sl.color} strokeWidth={sw}
          strokeDasharray={`${dash} ${C-dash}`} strokeDashoffset={off}
          transform={`rotate(-90 ${cx} ${cy})`} style={{transition:"all .7s cubic-bezier(.4,0,.2,1)"}}/>;
      })}
      {withMeta.map((sl,i)=>{
        const ex=cx+Math.cos(sl.angle)*r, ey=cy+Math.sin(sl.angle)*r;
        const bx=cx+Math.cos(sl.angle)*bubDist, by=cy+Math.sin(sl.angle)*bubDist;
        const lx=cx+Math.cos(sl.angle)*labelDist, ly=cy+Math.sin(sl.angle)*labelDist;
        const anchor = Math.cos(sl.angle)>0.2?"start":Math.cos(sl.angle)<-0.2?"end":"middle";
        return(<g key={i}>
          <line x1={ex} y1={ey} x2={bx} y2={by} stroke={sl.color} strokeWidth={1.5} opacity={.5}/>
          <circle cx={bx} cy={by} r={bubR} fill={sl.color}/>
          <text x={bx} y={by+7} textAnchor="middle" fontSize="19" fontFamily="'Inter',sans-serif">{sl.icon}</text>
          <text x={lx} y={ly+6} textAnchor={anchor} fontSize="18" fontWeight="800" fill={sl.color} fontFamily="'Inter',sans-serif">{Math.round(sl.frac*100)}%</text>
        </g>);
      })}
    </svg>
  );
}

/* ═══ Modal — по центру на десктопе, шторкой снизу на мобильном (как веб/моб. версии Monarch) ═══ */
function Modal({open,onClose,title,children}){
  if(!open) return null;
  return(
    <div onClick={onClose} className="modal-overlay" style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(15,18,23,.45)",display:"flex",alignItems:"flex-end",justifyContent:"center",animation:"fadeIn .2s"}}>
      <div onClick={e=>e.stopPropagation()} className="modal-box" style={{background:"var(--card)",border:"1px solid var(--border)",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",padding:"22px 20px 30px",animation:"slideUp .3s cubic-bezier(.32,.72,.24,1)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:700,color:"var(--t1)"}}>{title}</h3>
          <button onClick={onClose} className="btn-icon">✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

const IS={width:"100%",padding:"10px 12px",borderRadius:8,fontSize:14,border:"1px solid var(--border)",background:"var(--input)",color:"var(--t1)",boxSizing:"border-box",outline:"none",fontFamily:"inherit",transition:"border-color .2s"};

/* ═══ Поле числа с разделителями разрядов (3 000 000) — показывает форматированное значение,
   пока не в фокусе; при вводе — обычные цифры, без прыжков курсора ═══ */
function formatThousands(n){
  if(n===""||n==null||isNaN(Number(n))) return "";
  const parts = String(n).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return parts.join(",");
}
function NumberInput({value,onChange,placeholder,style,inputMode}){
  const[focused,setFocused]=useState(false);
  const display = focused ? (value??"") : formatThousands(value);
  return <input
    type="text"
    inputMode={inputMode||"decimal"}
    value={display}
    placeholder={placeholder}
    style={style}
    onFocus={()=>setFocused(true)}
    onBlur={()=>setFocused(false)}
    onChange={e=>{
      let raw = e.target.value.replace(/[^\d.,\-]/g,"").replace(",",".");
      const firstDot = raw.indexOf(".");
      if(firstDot!==-1) raw = raw.slice(0,firstDot+1) + raw.slice(firstDot+1).replace(/\./g,"");
      onChange({target:{value:raw}});
    }}
  />;
}

/* ═══ Calendar ═══ */
function CalendarPicker({value,onChange}){
  const dark = useTheme();
  const[open,setOpen]=useState(false);
  const parsed=value?new Date(value):new Date();
  const[vY,setVY]=useState(parsed.getFullYear());
  const[vM,setVM]=useState(parsed.getMonth());
  const ref=useRef(null);
  useEffect(()=>{if(open){setVY(parsed.getFullYear());setVM(parsed.getMonth());}},[open]);
  useEffect(()=>{if(!open)return;const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};document.addEventListener("mousedown",h);document.addEventListener("touchstart",h);return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("touchstart",h);};},[open]);
  const today=new Date(),todayS=today.toISOString().slice(0,10);
  const yest=new Date(today);yest.setDate(yest.getDate()-1);const yestS=yest.toISOString().slice(0,10);
  const pick=ds=>{onChange(ds);setOpen(false);};
  const pMo=()=>{if(vM===0){setVM(11);setVY(vY-1);}else setVM(vM-1);};
  const nMo=()=>{if(vM===11){setVM(0);setVY(vY+1);}else setVM(vM+1);};
  const fd=new Date(vY,vM,1),sw=(fd.getDay()+6)%7,dim=new Date(vY,vM+1,0).getDate(),pdm=new Date(vY,vM,0).getDate();
  const cells=[];
  for(let i=0;i<sw;i++)cells.push({day:pdm-sw+1+i,out:true});
  for(let i=1;i<=dim;i++)cells.push({day:i,out:false,ds:`${vY}-${String(vM+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`});
  const rm=7-cells.length%7;if(rm<7)for(let i=1;i<=rm;i++)cells.push({day:i,out:true});
  const disp=value?new Date(value).toLocaleDateString("ru-RU",{day:"numeric",month:"short",year:"numeric"}):"Выберите дату";
  return(
    <div ref={ref} style={{position:"relative"}}>
      <button type="button" onClick={()=>setOpen(!open)} style={{...IS,textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",color:value?"var(--t1)":"var(--t3)"}}>
        <span>{disp}</span><span style={{fontSize:15,opacity:.5}}>📅</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 8px)",left:0,right:0,zIndex:200,background:"var(--card)",borderRadius:20,boxShadow:"0 8px 40px rgba(0,0,0,.18)",padding:16,animation:"calOpen .25s ease",minWidth:280}}>
          <div style={{display:"flex",gap:6,marginBottom:14}}>
            {[[todayS,"Сегодня"],[yestS,"Вчера"]].map(([v,l])=>(
              <button key={v} type="button" onClick={()=>pick(v)} style={{flex:1,padding:"9px 0",borderRadius:12,fontSize:13,fontWeight:700,border:value===v?"2px solid var(--accent)":"1.5px solid var(--border)",background:value===v?"var(--accent-soft)":"var(--input)",color:value===v?"var(--accent)":"var(--t2)",cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <button type="button" onClick={pMo} className="btn-icon" style={{width:32,height:32}}>‹</button>
            <span style={{fontWeight:700,fontSize:14,color:"var(--t1)"}}>{MN[vM]} {vY}</span>
            <button type="button" onClick={nMo} className="btn-icon" style={{width:32,height:32}}>›</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
            {WD.map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"var(--t3)",padding:"4px 0"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
            {cells.map((c,i)=>{const sel=!c.out&&c.ds===value;const isT=!c.out&&c.ds===todayS;
              return <button type="button" key={i} disabled={c.out} onClick={()=>!c.out&&pick(c.ds)} style={{width:"100%",aspectRatio:"1",borderRadius:12,border:"none",fontSize:13,fontWeight:sel||isT?700:500,background:sel?"var(--accent)":isT?"var(--accent-soft)":"transparent",color:c.out?"var(--t4)":sel?"#fff":isT?"var(--accent)":"var(--t1)",cursor:c.out?"default":"pointer",transition:"all .15s",display:"grid",placeItems:"center"}}>{c.day}</button>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ SyncGate — экран перед онбордингом: подключиться к общим данным по ссылке синхронизации ═══ */
function SyncGate({onConnect, onSkip, connecting, error}){
  const[url,setUrl]=useState("");
  const ok = url.trim().startsWith("https://script.google.com/");
  return(
    <div style={{maxWidth:460,width:"100%",textAlign:"center"}}>
      <div style={{width:72,height:72,borderRadius:20,background:"var(--accent)",display:"grid",placeItems:"center",margin:"0 auto 16px",boxShadow:"0 8px 24px var(--accent-glow)"}}>
        <span style={{fontSize:32,filter:"brightness(10)"}}>💰</span>
      </div>
      <h1 style={{fontSize:28,fontWeight:800,marginBottom:4,color:"var(--t1)",letterSpacing:"-.03em"}}>Семейный бюджет</h1>
      <p style={{color:"var(--t3)",marginBottom:32,fontSize:14,lineHeight:1.6}}>Если вам прислали ссылку синхронизации — вставьте её, и все общие данные подгрузятся автоматически</p>
      <C$ style={{textAlign:"left"}}>
        <label style={LS}>Ссылка синхронизации</label>
        <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" style={IS}/>
        {error && <div style={{fontSize:12,color:"var(--danger)",marginTop:8}}>Не удалось подключиться: {error}</div>}
        <button disabled={!ok||connecting} onClick={()=>onConnect(url.trim())} className="btn-primary" style={{marginTop:16,opacity:(ok&&!connecting)?1:.5}}>{connecting?"Подключаемся…":"Подключиться и загрузить данные"}</button>
      </C$>
      <button onClick={onSkip} style={{marginTop:14,background:"none",border:"none",color:"var(--t3)",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>У меня нет ссылки — начать с чистого листа</button>
    </div>
  );
}

function Onboarding({onDone}){
  const[names,setNames]=useState(["",""]);
  const[budget,setBudget]=useState("50000");
  const upd=(i,v)=>{const c=[...names];c[i]=v;setNames(c);};
  const ok=names.some(n=>n.trim())&&budget;
  return(
    <div style={{maxWidth:460,width:"100%",textAlign:"center"}}>
      <div style={{width:72,height:72,borderRadius:20,background:"var(--accent)",display:"grid",placeItems:"center",margin:"0 auto 16px",boxShadow:"0 8px 24px var(--accent-glow)"}}>
        <span style={{fontSize:32,filter:"brightness(10)"}}>💰</span>
      </div>
      <h1 style={{fontSize:28,fontWeight:800,marginBottom:4,color:"var(--t1)",letterSpacing:"-.03em"}}>Семейный бюджет</h1>
      <p style={{color:"var(--t3)",marginBottom:32,fontSize:14,lineHeight:1.6}}>Добавьте участников и установите месячный бюджет</p>
      <C$ style={{textAlign:"left"}}>
        <label style={LS}>Участники</label>
        {names.map((n,i)=>(
          <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"center"}}>
            <div style={{width:42,height:42,borderRadius:14,flexShrink:0,background:PAL[i%6].bg,color:PAL[i%6].text,display:"grid",placeItems:"center",fontWeight:700,fontSize:14}}>{n.trim()?n.trim().slice(0,2).toUpperCase():"?"}</div>
            <input value={n} onChange={e=>upd(i,e.target.value)} placeholder={`Участник ${i+1}`} style={{...IS,flex:1,width:"auto"}}/>
            {names.length>1&&<button onClick={()=>setNames(names.filter((_,j)=>j!==i))} className="btn-icon">✕</button>}
          </div>
        ))}
        {names.length<6&&<button onClick={()=>setNames([...names,""])} style={{width:"100%",padding:12,borderRadius:14,border:"2px dashed var(--border)",background:"transparent",cursor:"pointer",color:"var(--t3)",fontWeight:600,fontSize:13,marginTop:4,fontFamily:"inherit"}}>+ Добавить</button>}
        <div style={{marginTop:20}}>
          <label style={LS}>Месячный бюджет (₽)</label>
          <NumberInput value={budget} onChange={e=>setBudget(e.target.value)} style={IS}/>
        </div>
        <button disabled={!ok} onClick={()=>onDone(names.filter(n=>n.trim()),Number(budget)||50000)} className="btn-primary" style={{marginTop:20,opacity:ok?1:.5}}>Начать</button>
      </C$>
    </div>
  );
}

/* ═══ Chip выбора валюты ═══ */

  return(
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {list.map(c=>{const s=c.code===value;

/* ═══ Форма расхода/дохода ═══ */
function ExpenseForm({members,expense,defaultCurrency,wallets,onSave,onDelete,onClose}){
  const dark = useTheme();
  const ed=!!expense;
  const[memberId,setMemberId]=useState(expense?.memberId||members[0]?.id||"");
  const[categoryId,setCategoryId]=useState(expense?.categoryId||"");
  const[desc,setDesc]=useState(expense?.desc||"");
  const[amount,setAmount]=useState(expense?.amount?.toString()||"");
  const[currency,setCurrency]=useState(expense?.currency||defaultCurrency||"RUB");
  const[walletCurrency,setWalletCurrency]=useState(expense?.walletCurrency||expense?.currency||defaultCurrency||"RUB");
  const[conversionRate,setConversionRate]=useState(expense?.conversionRate?.toString()||"");
  const[rateLoading,setRateLoading]=useState(false);
  const[date,setDate]=useState(expense?.date||todayStr());
  const[type,setType]=useState(expense?.type||"expense");
  const[note,setNote]=useState(expense?.note||"");
  const[splitOn,setSplitOn]=useState(!!expense?.split);
  const others = members.filter(m=>m.id!==memberId);
  const[selOthers,setSelOthers]=useState(()=>{
    if(expense?.split) return Object.keys(expense.split.shares||{});
    return others.length ? [others[0].id] : [];
  });
  const[splitMode,setSplitMode]=useState(expense?.split?.mode||"equal");
  const[customShares,setCustomShares]=useState(expense?.split?.shares||{});

  // при смене валюты платежа подбираем разумный кошелёк по умолчанию:
  // тот же код, если по нему есть покупки, иначе — кошелёк с наибольшим остатком
  useEffect(()=>{
    if(ed) return; // не трогаем при редактировании существующей записи
    const sameWallet = wallets.find(w=>w.code===currency);
    if(sameWallet){ setWalletCurrency(currency); return; }
    const best = [...wallets].filter(w=>w.rest>0).sort((a,b)=>b.rest-a.rest)[0];
    setWalletCurrency(best ? best.code : currency);
  },[currency]);

  const fetchRate = async () => {
    if(walletCurrency===currency) return;
    setRateLoading(true);
    try{
      const res = await fetch(`https://open.er-api.com/v6/latest/${walletCurrency}`);
      const d = await res.json();
      if(d.rates && d.rates[currency]) setConversionRate(String(Math.round(d.rates[currency]*10000)/10000));
    }catch(e){ /* тихо игнорируем — просто не подставится, курс введут вручную */ }
    setRateLoading(false);
  };
  useEffect(()=>{
    if(type==="expense" && walletCurrency!==currency && !conversionRate && !ed) fetchRate();
  },[walletCurrency,currency]);

  const cur = curInfo(currency);
  const walCur = curInfo(walletCurrency);
  const cat=CATS.find(c=>c.id===categoryId);
  const needsRate = type==="expense" && walletCurrency!==currency;
  const ok=memberId&&categoryId&&amount&&date&&(!needsRate||Number(conversionRate)>0);
  const amt = Number(amount)||0;
  const perHead = selOthers.length ? amt/(selOthers.length+1) : amt;

  const toggleOther = id => setSelOthers(s => s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);

  const buildSplit = () => {
    if (!splitOn || !selOthers.length) return null;
    const shares = {};
    const settled = expense?.split?.settled || {};
    selOthers.forEach(id => {
      shares[id] = splitMode==="equal" ? perHead : (Number(customShares[id])||0);
      if (!(id in settled)) settled[id] = false;
    });
    return { participantIds: [memberId, ...selOthers], mode: splitMode, shares, settled };
  };

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div>
        <label style={LS}>Кто потратил</label>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {members.map(m=>{const p=gpal(m,dark);const s=m.id===memberId;
            return <button key={m.id} onClick={()=>setMemberId(m.id)} style={{padding:"10px 18px",borderRadius:14,border:s?`2px solid ${p.accent}`:"1.5px solid var(--border)",background:s?p.bg:"var(--input)",color:s?p.text:"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:13,fontFamily:"inherit",transition:"all .2s"}}>{m.name}</button>;
          })}
        </div>
      </div>
      <div>
        <label style={LS}>Тип</label>
        <div style={{display:"flex",gap:8}}>
          {[["expense","Расход","var(--danger)","var(--danger-soft)"],["income","Доход","var(--accent)","var(--accent-soft)"]].map(([v,l,ac,bg])=>(
            <button key={v} onClick={()=>{setType(v);if(v==="income")setCurrency("RUB");}} style={{flex:1,padding:"11px 0",borderRadius:14,border:type===v?`2px solid ${ac}`:"1.5px solid var(--border)",background:type===v?bg:"var(--input)",color:type===v?ac:"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:14,fontFamily:"inherit"}}>{l}</button>
          ))}
        </div>
      </div>
      <div>
        <label style={LS}>Статья</label>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:6}}>
          {CATS.map(c=>{const s=c.id===categoryId;
            return <button key={c.id} onClick={()=>setCategoryId(c.id)} style={{padding:"12px 4px",borderRadius:14,border:s?`2px solid ${c.color}`:"1.5px solid var(--border)",background:s?c.color+"18":"var(--input)",cursor:"pointer",fontWeight:600,fontSize:11,fontFamily:"inherit",color:s?c.color:"var(--t2)",transition:"all .15s",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <span style={{fontSize:20}}>{c.icon}</span><span>{c.name}</span></button>;
          })}
        </div>
      </div>
      {type==="expense" && <div>
        <label style={LS}>Валюта платежа</label>
        <CurrencyChips value={currency} onChange={setCurrency}/>
      </div>}
      {type==="expense" && wallets.length>0 && <div>
        <label style={LS}>Списывается с кошелька</label>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {[...new Set([currency,...wallets.map(w=>w.code)])].map(cc=>{const w=wallets.find(x=>x.code===cc);const s=cc===walletCurrency;const info=curInfo(cc);
            return <button key={cc} type="button" onClick={()=>setWalletCurrency(cc)} style={{padding:"9px 14px",borderRadius:12,border:s?"2px solid var(--accent)":"1.5px solid var(--border)",background:s?"var(--accent-soft)":"var(--input)",color:s?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{info.symbol} {cc}{w?` · ост. ${fmt(w.rest)}`:""}</button>;
          })}
        </div>
        {needsRate && <div style={{marginTop:10}}>
          <label style={LS}>Курс {cur.symbol} за 1 {walCur.symbol} (на момент оплаты)</label>
          <div style={{display:"flex",gap:8}}>
            <NumberInput value={conversionRate} onChange={e=>setConversionRate(e.target.value)} placeholder="напр. 26100" style={{...IS,flex:1}}/>
            <button type="button" onClick={fetchRate} className="btn-icon" style={{width:"auto",padding:"0 14px",fontWeight:700,fontSize:12}} disabled={rateLoading}>{rateLoading?"…":"⟳ курс"}</button>
          </div>
          <div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>Подтягивается автоматически по межбанковскому курсу — если платили картой Mastercard/UnionPay, поправьте на реальный курс с чека, если отличается.</div>
        </div>}
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><label style={LS}>Сумма ({cur.symbol})</label><NumberInput value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0" style={IS} inputMode="decimal"/></div>
        <div><label style={LS}>Дата</label><CalendarPicker value={date} onChange={setDate}/></div>
      </div>
      <div><label style={LS}>Описание</label><input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Пятёрочка, бизнес-ланч..." style={IS}/></div>
      <div><label style={LS}>Примечание</label><input value={note} onChange={e=>setNote(e.target.value)} style={IS}/></div>

      {type==="expense" && others.length>0 && (
        <C$ style={{padding:14,background:"var(--bg2)"}}>
          <label style={{...LS,display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}>
            <input type="checkbox" checked={splitOn} onChange={e=>setSplitOn(e.target.checked)} style={{width:16,height:16}}/>
            Разделить с другими участниками
          </label>
          {splitOn && <div style={{marginTop:10}}>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              {others.map(m=>{const s=selOthers.includes(m.id);
                return <button key={m.id} type="button" onClick={()=>toggleOther(m.id)} style={{padding:"8px 14px",borderRadius:12,border:s?"2px solid var(--accent)":"1.5px solid var(--border)",background:s?"var(--accent-soft)":"var(--input)",color:s?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{m.name}</button>;
              })}
            </div>
            {selOthers.length>0 && <>
              <div style={{display:"flex",gap:8,marginBottom:10}}>
                {[["equal","Поровну"],["custom","Вручную"]].map(([v,l])=>(
                  <button key={v} type="button" onClick={()=>setSplitMode(v)} style={{flex:1,padding:"8px 0",borderRadius:10,border:splitMode===v?"2px solid var(--accent)":"1.5px solid var(--border)",background:splitMode===v?"var(--accent-soft)":"var(--input)",color:splitMode===v?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{l}</button>
                ))}
              </div>
              {selOthers.map(id=>{const m=members.find(x=>x.id===id);
                return(<div key={id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 0",fontSize:13}}>
                  <span style={{color:"var(--t2)",fontWeight:600}}>{m?.name} должен(на)</span>
                  {splitMode==="equal"
                    ? <span style={{fontWeight:700,color:"var(--t1)"}}>{fmt(perHead)} {cur.symbol}</span>
                    : <NumberInput value={customShares[id]??""} onChange={e=>setCustomShares(s=>({...s,[id]:e.target.value}))} placeholder={fmt(perHead)} style={{...IS,width:110,padding:"6px 10px"}}/>}
                </div>);
              })}
              <div style={{fontSize:11,color:"var(--t3)",marginTop:6}}>Остальное ({cur.symbol}) остаётся на {members.find(m=>m.id===memberId)?.name||"плательщике"} — он(а) уже заплатил(а).</div>
            </>}
          </div>}
        </C$>
      )}

      <button disabled={!ok} onClick={()=>{onSave({...(expense||{}),memberId,categoryId,desc,amount:amt,currency:type==="income"?"RUB":currency,walletCurrency:type==="income"?"RUB":walletCurrency,conversionRate:needsRate?Number(conversionRate):null,date,type,note,split:type==="expense"?buildSplit():null});onClose();}} className="btn-primary" style={{opacity:ok?1:.5}}>{ed?"Сохранить":"Добавить"}</button>
      {ed&&<button onClick={()=>{onDelete(expense.id);onClose();}} className="btn-primary" style={{background:"var(--danger-soft)",color:"var(--danger)"}}>Удалить запись</button>}
    </div>
  );
}

/* ═══ Форма покупки валюты ═══ */
function PurchaseForm({purchase,lastChoice,onSave,onDelete,onClose}){
  const ed=!!purchase;
  const[date,setDate]=useState(purchase?.date||todayStr());
  const[currency,setCurrency]=useState(purchase?.currency||lastChoice?.currency||"VND");
  const[midCurrency,setMidCurrency]=useState(purchase?.midCurrency||lastChoice?.midCurrency||"USD");
  const[amount,setAmount]=useState(purchase?.amount?.toString()||"");
  const[rateDirect,setRateDirect]=useState(purchase?.rateDirect?.toString()||"");
  const[rateMidRub,setRateMidRub]=useState(purchase?.rateMidRub?.toString()||"");
  const[rateCurPerMid,setRateCurPerMid]=useState(purchase?.rateCurPerMid?.toString()||"");
  const[note,setNote]=useState(purchase?.note||"");

  // промежуточная валюта не может совпадать с покупаемой
  useEffect(()=>{ if(midCurrency===currency){ setMidCurrency(currency==="RUB"?"USD":"RUB"); } },[currency]);

  const isDirect = midCurrency==="RUB";
  const cur = curInfo(currency);
  const midCur = curInfo(midCurrency);
  const amt=Number(amount)||0, rDir=Number(rateDirect)||0, rMid=Number(rateMidRub)||0, rCpm=Number(rateCurPerMid)||0;
  const rubCost = isDirect ? amt*rDir : (rCpm>0 ? (amt/rCpm)*rMid : 0);
  const ok = amount && date && (isDirect ? rateDirect : (rateMidRub && rateCurPerMid));

  const save = () => {
    onSave({
      id: purchase?.id||uid(), date, currency, amount: amt,
      midCurrency,
      rateDirect: isDirect ? rDir : null,
      rateMidRub: isDirect ? null : rMid,
      rateCurPerMid: isDirect ? null : rCpm,
      note, createdAt: purchase?.createdAt||Date.now()
    });
    onClose();
  };

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div><label style={LS}>Дата покупки</label><CalendarPicker value={date} onChange={setDate}/></div>
      <div><label style={LS}>Валюта покупки</label><CurrencyChips value={currency} onChange={setCurrency} exclude={["RUB"]}/></div>
      <div><label style={LS}>Сумма покупки ({cur.symbol})</label><NumberInput value={amount} onChange={e=>setAmount(e.target.value)} placeholder="напр. 3 000 000" style={IS} inputMode="decimal"/></div>
      <div>
        <label style={LS}>Через какую валюту конвертируете</label>
        <CurrencyChips value={midCurrency} onChange={setMidCurrency} exclude={[currency]}/>
        <div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>«Рубль» — если купили {cur.name.toLowerCase()} напрямую за рубли. «Доллар»/«Юань» — если сначала купили их, а потом обменяли на {cur.name.toLowerCase()}.</div>
      </div>
      {isDirect
        ? <div><label style={LS}>Курс покупки, ₽ за 1 {currency}</label><NumberInput value={rateDirect} onChange={e=>setRateDirect(e.target.value)} placeholder={currency==="VND"?"напр. 0.0032":"напр. 85.5"} style={IS}/></div>
        : <>
            <div><label style={LS}>Курс покупки {midCurrency==="USD"?"доллара":"юаня"}, ₽ за 1 {midCurrency}</label><NumberInput value={rateMidRub} onChange={e=>setRateMidRub(e.target.value)} placeholder="напр. 85.5" style={IS}/></div>
            <div><label style={LS}>Курс обмена, {currency}/{midCurrency}</label><NumberInput value={rateCurPerMid} onChange={e=>setRateCurPerMid(e.target.value)} placeholder="напр. 26100" style={IS}/></div>
          </>}
      <div><label style={LS}>Комментарий</label><input value={note} onChange={e=>setNote(e.target.value)} placeholder="необязательно" style={IS}/></div>
      {ok && <div style={{fontSize:13,color:"var(--t2)",background:"var(--accent-soft)",borderRadius:12,padding:"10px 14px"}}>≈ потрачено <b>{fmt(rubCost)} ₽</b> на эту покупку</div>}
      <button disabled={!ok} onClick={save} className="btn-primary" style={{opacity:ok?1:.5}}>{ed?"Сохранить":"Добавить покупку"}</button>
      {ed&&<button onClick={()=>{onDelete(purchase.id);onClose();}} className="btn-primary" style={{background:"var(--danger-soft)",color:"var(--danger)"}}>Удалить запись</button>}
    </div>
  );
}

/* ═══ Вкладка «Валюта» ═══ */
function CurrencyTab({data,setData}){
  const[addOpen,setAddOpen]=useState(false);
  const[editPurchase,setEditPurchase]=useState(null);
  const purchases = data.purchases||[];
  const walletCurrencies = [...new Set(purchases.map(p=>p.currency))];
  const sorted = [...purchases].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));

  const savePurchase = p => setData(pr=>{
    const list = pr.purchases||[];
    const exists = list.some(x=>x.id===p.id);
    return {
      ...pr,
      purchases: exists ? list.map(x=>x.id===p.id?p:x) : [...list,p],
      settings: {...pr.settings, lastPurchaseCurrency:p.currency, lastPurchaseMidCurrency:p.midCurrency}
    };
  });
  const deletePurchase = id => setData(pr=>({...pr,purchases:(pr.purchases||[]).filter(x=>x.id!==id)}));
  const lastChoice = { currency: data.settings?.lastPurchaseCurrency, midCurrency: data.settings?.lastPurchaseMidCurrency };

  // живой курс каждого кошелька к донгу (для отображения остатка в VND по текущему курсу)
  const[liveVnd,setLiveVnd]=useState({});
  useEffect(()=>{
    walletCurrencies.forEach(cc=>{
      if(cc==="VND" || liveVnd[cc]!==undefined) return;
      fetch(`https://open.er-api.com/v6/latest/${cc}`).then(r=>r.json()).then(d=>{
        if(d.rates && d.rates.VND) setLiveVnd(pr=>({...pr,[cc]:d.rates.VND}));
      }).catch(()=>setLiveVnd(pr=>({...pr,[cc]:null})));
    });
  },[walletCurrencies.join(",")]);

  const rateLabel = p => {
    if(!p.midCurrency || p.midCurrency==="RUB") return `${fmt(p.rateDirect,p.rateDirect<1?4:2)} ₽/${p.currency}`;
    return `${fmt(p.rateMidRub,2)} ₽/${p.midCurrency}, ${fmt(p.rateCurPerMid)} ${p.currency}/${p.midCurrency}`;
  };

  return(
    <div className="stack">

/* ═══ Вкладка «Долги» ═══ */
function DebtsTab({data,setData,rubMap,dark}){
  const members = data.members;
  const gm = id => members.find(m=>m.id===id);
  const[lineFilter,setLineFilter]=useState("unsettled"); // unsettled | settled | all

  // построение чистых балансов между парами (только непогашенные — это и есть актуальный долг)
  const net = {}; // net[a][b] = сколько a должен b (после взаимозачёта)
  const lines = []; // ВСЕ построчные доли — и погашенные, и нет
  data.expenses.forEach(e=>{
    if(!e.split) return;
    const total = rubMap[e.id]?.rub || 0;
    Object.entries(e.split.shares||{}).forEach(([owerId, shareCur])=>{
      const shareRub = e.amount>0 ? (shareCur/e.amount)*total : 0;
      if(shareRub<=0) return;
      const settled = !!e.split.settled?.[owerId];
      lines.push({expenseId:e.id, owerId, payerId:e.memberId, amountRub:shareRub, desc:e.desc, catId:e.categoryId, date:e.date, settled});
      if(!settled){ net[owerId]=net[owerId]||{}; net[owerId][e.memberId]=(net[owerId][e.memberId]||0)+shareRub; }
    });
  });
  const pairs=[]; const seen=new Set();
  Object.keys(net).forEach(a=>Object.keys(net[a]).forEach(b=>{
    const key=[a,b].sort().join("|"); if(seen.has(key))return; seen.add(key);
    const aOwesB=net[a]?.[b]||0, bOwesA=net[b]?.[a]||0, d=aOwesB-bOwesA;
    if(Math.abs(d)<1)return;
    pairs.push(d>0?{ower:a,payer:b,amount:d}:{ower:b,payer:a,amount:-d});
  }));

  const settleAll=(owerId,payerId)=>{
    setData(pr=>({...pr,expenses:pr.expenses.map(e=>{
      if(!e.split||e.memberId!==payerId||!(owerId in (e.split.shares||{})))return e;
      return {...e,split:{...e.split,settled:{...e.split.settled,[owerId]:true}}};
    })}));
  };
  const toggleLine=(expenseId,owerId)=>{
    setData(pr=>({...pr,expenses:pr.expenses.map(e=>{
      if(e.id!==expenseId||!e.split)return e;
      return {...e,split:{...e.split,settled:{...e.split.settled,[owerId]:!e.split.settled?.[owerId]}}};
    })}));
  };

  const visibleLines = lines.filter(l=>lineFilter==="all"?true:lineFilter==="settled"?l.settled:!l.settled);

  return(
    <div className="stack">
      <C$>
        <div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:14}}>Итоговый баланс</div>
        {!pairs.length && <div style={{textAlign:"center",padding:24,color:"var(--t3)",fontSize:13}}>Все в расчёте — непогашенных долгов нет 🎉</div>}
        {pairs.map((p,i)=>{const ower=gm(p.ower),payer=gm(p.payer);if(!ower||!payer)return null;
          return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<pairs.length-1?"1px solid var(--border)":"none"}}>
            <div style={{flex:1,fontSize:13,color:"var(--t1)"}}><b>{ower.name}</b> должен(на) <b>{payer.name}</b></div>
            <div style={{fontSize:15,fontWeight:800,color:"var(--t1)"}}>{fmt(p.amount)} ₽</div>
            <button onClick={()=>settleAll(p.ower,p.payer)} style={{padding:"7px 12px",borderRadius:10,border:"none",background:"var(--accent-soft)",color:"var(--accent)",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Вернул(а)</button>
          </div>);
        })}
      </C$>

      <C$>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div style={{fontSize:14,fontWeight:700,color:"var(--t1)"}}>По операциям</div>
          <div style={{display:"flex",gap:6}}>
            {[["unsettled","Активные"],["settled","Погашенные"],["all","Все"]].map(([v,l])=>(
              <button key={v} onClick={()=>setLineFilter(v)} style={{padding:"6px 11px",borderRadius:8,border:lineFilter===v?"1.5px solid var(--accent)":"1px solid var(--border)",background:lineFilter===v?"var(--accent-soft)":"var(--input)",color:lineFilter===v?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:600,fontSize:11.5,fontFamily:"inherit"}}>{l}</button>
            ))}
          </div>
        </div>
        {!visibleLines.length && <div style={{textAlign:"center",padding:16,color:"var(--t3)",fontSize:13}}>{lineFilter==="settled"?"Погашенных долгов пока нет":"Нет разделённых расходов"}</div>}
        {visibleLines.sort((a,b)=>b.date.localeCompare(a.date)).map((l,i)=>{const ower=gm(l.owerId),payer=gm(l.payerId);const cat=CATS.find(c=>c.id===l.catId);
          return(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--border)",opacity:l.settled?.6:1}}>
            <span style={{fontSize:18,flexShrink:0}}>{cat?.icon||"📦"}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12.5,color:"var(--t1)",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:l.settled?"line-through":"none"}}>{l.desc||cat?.name}</div>
              <div style={{fontSize:11,color:"var(--t3)"}}>{ower?.name} → {payer?.name} · {new Date(l.date).toLocaleDateString("ru-RU")}</div>
            </div>
            <span style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>{fmt(l.amountRub)} ₽</span>
            <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"var(--t3)",cursor:"pointer"}}>
              <input type="checkbox" checked={l.settled} onChange={()=>toggleLine(l.expenseId,l.owerId)} style={{width:15,height:15}}/> вернул
            </label>
          </div>);
        })}
      </C$>
    </div>
  );
}

function emptyData(){
  return {members:[],expenses:[],purchases:[],budget:50000,goal:10000,warn:80,categoryBudgets:{},settings:{defaultCurrency:"RUB",displayCurrency:"RUB"}};
}
// Приводит ЛЮБОЙ пришедший объект (из localStorage или с сервера синхронизации) к безопасной,
// гарантированно корректной форме — никогда не бросает исключение, никогда не роняет рендер.
function normalizeData(input){
  try{
    if(!input || typeof input !== "object") return emptyData();
    const d = {...input};
    if (d.expenses && !Array.isArray(d.expenses)) d.expenses = Object.values(d.expenses);
    if (!Array.isArray(d.expenses)) d.expenses = [];
    if (d.members && !Array.isArray(d.members)) d.members = Object.values(d.members);
    if (!Array.isArray(d.members)) d.members = [];
    if (!Array.isArray(d.purchases)) d.purchases = [];
    d.members = d.members.filter(m=>m && m.id);
    d.expenses = d.expenses.filter(e=>e && e.id).map(e=>({...e, currency: e.currency||"RUB"}));
    d.purchases = d.purchases.filter(p=>p && p.id).map(p=>{
      if (p.midCurrency !== undefined) return p; // уже новая схема
      if (p.rateUsdRub !== undefined) { // миграция со старой схемы (промежуточная валюта всегда была USD)
        if (p.currency === "USD") return { ...p, midCurrency:"RUB", rateDirect: p.rateUsdRub||0, rateMidRub:null, rateCurPerMid:null };
        return { ...p, midCurrency:"USD", rateMidRub:p.rateUsdRub, rateCurPerMid:p.rateCurPerUsd, rateDirect:null };
      }
      return p;
    });
    if (typeof d.budget !== "number") d.budget = 50000;
    if (typeof d.goal !== "number") d.goal = 10000;
    if (typeof d.warn !== "number") d.warn = 80;
    if (!d.settings || typeof d.settings !== "object") d.settings = {};
    d.settings = {defaultCurrency:"RUB",displayCurrency:"RUB",...d.settings};
    if (!d.categoryBudgets || typeof d.categoryBudgets !== "object") d.categoryBudgets = {};
    return d;
  }catch(e){
    return emptyData();
  }
}

/* ═══ Синхронизация через Google Таблицу (Apps Script как бесплатный JSON-бэкенд) ═══ */
async function syncPull(url) {
  const res = await fetch(url, {cache:"no-store"});
  if (!res.ok) throw new Error("сервер ответил ошибкой "+res.status);
  let json;
  try { json = await res.json(); }
  catch(e){ throw new Error("сервер вернул не JSON — проверьте, что в Apps Script доступ выставлен на «Anyone», а ссылка заканчивается на /exec"); }
  return json;
}
async function syncPush(url, data) {
  // text/plain — чтобы избежать CORS-preflight (Apps Script не обрабатывает OPTIONS по умолчанию)
  const res = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error("push failed: "+res.status);
  return res.json();
}
