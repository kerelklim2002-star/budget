  const[addOpen,setAddOpen]=useState(false);
  const[editExp,setEditExp]=useState(null);
  const[stOpen,setStOpen]=useState(false);
  const[gateDismissed,setGateDismissed]=useState(false);
  const[fM,setFM]=useState("all");
  const[fMo,setFMo]=useState(()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;});
  const[anPeriod,setAnPeriod]=useState("month");
  const[anCustomFrom,setAnCustomFrom]=useState(()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);});
  const[anCustomTo,setAnCustomTo]=useState(todayStr());
  const[anFormat,setAnFormat]=useState("day");
  const[syncUrl,setSyncUrlState]=useState(()=>{try{return localStorage.getItem("fam-budget-sync-url")||"";}catch{return"";}});
  const[syncStatus,setSyncStatus]=useState({state:"idle",time:null,error:null}); // idle|syncing|ok|error
  const didInitialSync = useRef(false);
  const syncReady = useRef(false); // true только после подтверждённого первого подключения к общей таблице — до этого пуш ЗАПРЕЩЁН
  const[syncRetryTick,setSyncRetryTick]=useState(0);
  const retrySync = () => { didInitialSync.current = false; setSyncRetryTick(t=>t+1); };
  const setSyncUrl = url => {
    didInitialSync.current = false;
    syncReady.current = false;
    setSyncStatus({state:"idle",time:null,error:null});
    setSyncUrlState(url);
    try{ url ? localStorage.setItem("fam-budget-sync-url",url) : localStorage.removeItem("fam-budget-sync-url"); }catch{}
  };
  const lastEditRef = useRef(0);
  const pushTimerRef = useRef(null);
  const ok=useRef(false);
  const dark = theme === "dark";

  useEffect(()=>{
    try {
      const raw = localStorage.getItem("fam-budget-local");
      const parsed = raw ? JSON.parse(raw) : null;
      setData(normalizeData(parsed));
      if (parsed && parsed.theme) setTheme(parsed.theme);
    } catch {
      setData(emptyData());
    }
    ok.current = true;
  },[]);

  useEffect(()=>{
    if (!ok.current || !data) return;
    try { localStorage.setItem("fam-budget-local", JSON.stringify({...data, theme})); } catch {}
    lastEditRef.current = Date.now();
    if (!syncUrl || !syncReady.current) return; // не отправляем ничего, пока не подтверждено первое подключение — это и защищает общие данные от перезаписи
    clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(async ()=>{
      setSyncStatus(s=>({...s,state:"syncing"}));
      try { await syncPush(syncUrl, data); setSyncStatus({state:"ok",time:Date.now(),error:null}); }
      catch(err){ setSyncStatus({state:"error",time:null,error:String(err.message||err)}); }
    }, 1200);
  },[data, theme]);

  // первичная синхронизация — выполняется РОВНО один раз на каждую новую ссылку, и только когда data гарантированно уже загружена из localStorage
  useEffect(()=>{
    if (!syncUrl || !data || didInitialSync.current) return;
    didInitialSync.current = true;
    (async ()=>{
      setSyncStatus(s=>({...s,state:"syncing"}));
      try {
        const remoteRaw = await syncPull(syncUrl);
        if (!remoteRaw || typeof remoteRaw !== "object") throw new Error("сервер вернул пустой ответ");
        const remote = normalizeData(remoteRaw);
        const remoteEmpty = remote.members.length===0 && remote.expenses.length===0;
        const localHasData = data.members.length>0 || data.expenses.length>0;
        if (remoteEmpty && localHasData) await syncPush(syncUrl, data); // таблица пустая — инициализируем текущими данными
        else setData(remote);
        syncReady.current = true; // подключение подтверждено — теперь пуши разрешены
        setSyncStatus({state:"ok",time:Date.now(),error:null});
      } catch(err){ setSyncStatus({state:"error",time:null,error:String(err.message||err)}); }
    })();
  },[syncUrl, data, syncRetryTick]);

  // подтягиваем актуальные данные при возврате в приложение (фокус вкладки/окна)
  useEffect(()=>{
    if (!syncUrl) return;
    const pull = async () => {
      if (!syncReady.current) return; // ждём завершения первичного подключения
      if (Date.now()-lastEditRef.current < 3000) return; // не перетираем только что введённое
      setSyncStatus(s=>({...s,state:"syncing"}));
      try {
        const remoteRaw = await syncPull(syncUrl);
        if (remoteRaw && typeof remoteRaw === "object") setData(normalizeData(remoteRaw));
        setSyncStatus({state:"ok",time:Date.now(),error:null});
      } catch(err){ setSyncStatus({state:"error",time:null,error:String(err.message||err)}); }
    };
    window.addEventListener("focus", pull);
    window.addEventListener("visibilitychange", pull);
    return ()=>{ window.removeEventListener("focus", pull); window.removeEventListener("visibilitychange", pull); };
  },[syncUrl]);

  const fifoIdx = useMemo(()=>data?buildFifoIndex(data.purchases||[]):{},[data?.purchases]);
  const rubMap = useMemo(()=>data?buildRubMap(data.expenses,fifoIdx):{},[data?.expenses,fifoIdx]);
  const getRub = e => rubMap[e.id]?.rub ?? e.amount ?? 0;
  const walletsList = useMemo(()=>{
    if(!data) return [];
    const codes = [...new Set((data.purchases||[]).map(p=>p.currency))];
    return codes.map(cc=>({code:cc, ...currencyBalance(cc, data.purchases||[], data.expenses)}));
  },[data?.purchases,data?.expenses]);

  const dispCur = data?.settings?.displayCurrency || "RUB";
  const[liveRates,setLiveRates]=useState({}); // code -> RUB за 1 единицу (фолбэк, когда своего кошелька нет)
  useEffect(()=>{
    if(!data || dispCur==="RUB" || fifoIdx[dispCur]) return;
    if(liveRates[dispCur]) return;
    let cancelled=false;
    fetch(`https://open.er-api.com/v6/latest/${dispCur}`).then(r=>r.json()).then(d=>{
      if(!cancelled && d.rates && d.rates.RUB) setLiveRates(pr=>({...pr,[dispCur]:d.rates.RUB}));
    }).catch(()=>{});
    return ()=>{cancelled=true;};
  },[dispCur,fifoIdx,data]);
  const displayRate = useMemo(()=>{
    if(!data || dispCur==="RUB") return 1;
    const lots = fifoIdx[dispCur];
    if(lots && lots.length) return lots[lots.length-1].rate;
    if(liveRates[dispCur]) return liveRates[dispCur];
    return null; // нет данных о курсе
  },[data,dispCur,fifoIdx,liveRates]);
  const conv = rub => displayRate ? rub/displayRate : rub;
  const dSym = curInfo(dispCur).symbol;

  const fil=useMemo(()=>data?data.expenses.filter(e=>e.date?.startsWith(fMo)&&(fM==="all"||e.memberId===fM)):[],[data,fMo,fM]);
  const totE=useMemo(()=>fil.filter(e=>e.type==="expense").reduce((s,e)=>s+getRub(e),0),[fil,rubMap]);
  const totI=useMemo(()=>fil.filter(e=>e.type==="income").reduce((s,e)=>s+getRub(e),0),[fil,rubMap]);
  const catBD=useMemo(()=>{const m={};fil.filter(e=>e.type==="expense").forEach(e=>{if(!m[e.categoryId])m[e.categoryId]={value:0,count:0};m[e.categoryId].value+=getRub(e);m[e.categoryId].count+=1;});return CATS.filter(c=>m[c.id]).map(c=>({...c,value:m[c.id].value,count:m[c.id].count})).sort((a,b)=>b.value-a.value);},[fil,rubMap]);
  const memBD=useMemo(()=>{if(!data)return[];const m={};fil.filter(e=>e.type==="expense").forEach(e=>{m[e.memberId]=(m[e.memberId]||0)+getRub(e);});return data.members.map(mem=>({...mem,value:m[mem.id]||0,color:PAL[mem.ci%6].accent})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);},[data,fil,rubMap]);
  const dayData=useMemo(()=>{const[y,mo]=fMo.split("-").map(Number);const days=new Date(y,mo,0).getDate();const a=Array.from({length:days},(_,i)=>({label:`${i+1}`,value:0}));fil.filter(e=>e.type==="expense").forEach(e=>{const d=parseInt(e.date.split("-")[2],10);if(d>=1&&d<=days)a[d-1].value+=getRub(e);});return a;},[fil,fMo,rubMap]);
  const sorted=useMemo(()=>[...fil].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)),[fil]);

  const [anFrom,anTo] = useMemo(()=>periodRange(anPeriod,anCustomFrom,anCustomTo),[anPeriod,anCustomFrom,anCustomTo]);
  const anFil = useMemo(()=>data?data.expenses.filter(e=>e.type==="expense"&&e.date>=anFrom&&e.date<=anTo&&(fM==="all"||e.memberId===fM)):[],[data,anFrom,anTo,fM]);
  const anTotE = useMemo(()=>anFil.reduce((s,e)=>s+getRub(e),0),[anFil,rubMap]);
  const anCatBD = useMemo(()=>{const m={};anFil.forEach(e=>{if(!m[e.categoryId])m[e.categoryId]={value:0,count:0};m[e.categoryId].value+=getRub(e);m[e.categoryId].count+=1;});return CATS.filter(c=>m[c.id]).map(c=>({...c,value:m[c.id].value,count:m[c.id].count})).sort((a,b)=>b.value-a.value);},[anFil,rubMap]);
  const anMemBD = useMemo(()=>{if(!data)return[];const m={};anFil.forEach(e=>{m[e.memberId]=(m[e.memberId]||0)+getRub(e);});return data.members.map(mem=>({...mem,value:m[mem.id]||0,color:PAL[mem.ci%6].accent})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value);},[data,anFil,rubMap]);
  const anBuckets = useMemo(()=>buildBuckets(anFil,anFormat,getRub,anFrom,anTo),[anFil,anFormat,rubMap,anFrom,anTo]);
  const anDays = useMemo(()=>{const ms=(new Date(anTo)-new Date(anFrom))/864e5+1;return Math.max(1,Math.round(ms));},[anFrom,anTo]);

  if(!data) return <div className={dark?"dark":""} style={{display:"grid",placeItems:"center",height:"100vh",background:"var(--bg0)"}}><style>{CSS}</style><p style={{color:"var(--t3)"}}>Загрузка...</p></div>;

  if(!data.members.length) {
    // ссылка синхронизации уже задана — ждём результата первичной подтяжки данных, не мигаем онбордингом раньше времени
    if (syncUrl) {
      if (syncStatus.state === "syncing" || syncStatus.state === "idle") return(
        <ThemeCtx.Provider value={dark}>
        <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",display:"grid",placeItems:"center",padding:20}}>
          <style>{CSS}</style>
          <div style={{textAlign:"center",color:"var(--t3)",fontSize:14}}>Подключаемся к общим данным…</div>
        </div>
        </ThemeCtx.Provider>
      );
      if (syncStatus.state === "error") return(
        <ThemeCtx.Provider value={dark}>
        <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",display:"grid",placeItems:"center",padding:20}}>
          <style>{CSS}</style>
          <div style={{maxWidth:420,width:"100%",textAlign:"center"}}>
            <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
            <h1 style={{fontSize:20,fontWeight:800,marginBottom:8,color:"var(--t1)"}}>Не удалось подключиться</h1>
            <p style={{color:"var(--t3)",fontSize:13,lineHeight:1.6,marginBottom:20}}>{syncStatus.error}</p>
            <C$ style={{textAlign:"left",marginBottom:14}}>
              <div style={{fontSize:12,color:"var(--t2)",lineHeight:1.6}}>
                Скорее всего дело в правах доступа Apps Script. Проверьте: в настройках развёртывания «Who has access» должно быть выставлено <b>Anyone</b> (не «Anyone with Google account»), а ссылка — заканчиваться на <b>/exec</b>.
                <br/><br/>Ваши данные не пострадали — приложение ничего не отправляло на сервер, пока подключение не подтвердилось.
              </div>
            </C$>
            <button onClick={retrySync} className="btn-primary" style={{marginBottom:10}}>Повторить попытку</button>
            <button onClick={()=>{setSyncUrl("");}} style={{background:"none",border:"none",color:"var(--t3)",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>Отключить синхронизацию и начать локально</button>
          </div>
        </div>
        </ThemeCtx.Provider>
      );
      // синхронизация прошла успешно, а участников в общей таблице действительно ещё нет — создаём с нуля
      return(
        <ThemeCtx.Provider value={dark}>
        <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",display:"grid",placeItems:"center",padding:20}}>
          <style>{CSS}</style>
          <Onboarding onDone={(names,budget)=>setData({members:names.map((n,i)=>({id:uid(),name:n,ci:i%6})),expenses:[],purchases:[],budget,goal:10000,warn:80,categoryBudgets:{},settings:{defaultCurrency:"RUB",displayCurrency:"RUB"}})}/>
        </div>
        </ThemeCtx.Provider>
      );
    }
    if (!gateDismissed) return(
      <ThemeCtx.Provider value={dark}>
      <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",display:"grid",placeItems:"center",padding:20}}>
        <style>{CSS}</style>
        <SyncGate connecting={syncStatus.state==="syncing"} error={syncStatus.state==="error"?syncStatus.error:null} onConnect={setSyncUrl} onSkip={()=>setGateDismissed(true)}/>
      </div>
      </ThemeCtx.Provider>
    );
    return(
      <ThemeCtx.Provider value={dark}>
      <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",display:"grid",placeItems:"center",padding:20}}>
        <style>{CSS}</style>
        <Onboarding onDone={(names,budget)=>setData({members:names.map((n,i)=>({id:uid(),name:n,ci:i%6})),expenses:[],purchases:[],budget,goal:10000,warn:80,categoryBudgets:{},settings:{defaultCurrency:"RUB",displayCurrency:"RUB"}})}/>
      </div>
      </ThemeCtx.Provider>
    );
  }

  const gm=id=>data.members.find(m=>m.id===id);
  const gp=m=>gpal(m,dark);
  const bP=pct(totE,data.budget);
  const over=bP>=100;const warning=bP>=(data.warn||80);const rem=data.budget-totE;
  const moLabel=new Date(fMo+"-01").toLocaleDateString("ru-RU",{month:"long",year:"numeric"});

  const CurSwitcher = () => (
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
      <span style={{fontSize:12,color:"var(--t3)",alignSelf:"center",marginRight:2}}>Показывать в:</span>
      {[...new Set(["RUB","VND",...Object.keys(fifoIdx)])].map(cc=>{const s=cc===dispCur;const cur=curInfo(cc);
        return <button key={cc} onClick={()=>setData(pr=>({...pr,settings:{...pr.settings,displayCurrency:cc}}))} style={{padding:"6px 12px",borderRadius:10,border:s?"2px solid var(--accent)":"1.5px solid var(--border)",background:s?"var(--accent-soft)":"var(--input)",color:s?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{cur.symbol} {cc}</button>;
      })}
    </div>
  );

  const TAB_ITEMS = [["dashboard","📊","Дашборд"],["list","📋","Записи"],["currency","💱","Валюта"],["debts","🤝","Долги"],["analytics","📈","Анализ"]];

  return(
    <ThemeCtx.Provider value={dark}>
    <div className={dark?"dark":""} style={{minHeight:"100vh",background:"var(--bg0)",color:"var(--t1)",transition:"background .3s, color .3s"}}>
      <style>{CSS}</style>

      <div className="app-shell">
        <nav className="sidebar">
          <div className="sidebar-brand">
            <div style={{width:30,height:30,borderRadius:8,background:"var(--accent)",display:"grid",placeItems:"center",flexShrink:0}}>
              <span style={{fontSize:15,filter:"brightness(10)"}}>💰</span>
            </div>
            <span style={{fontWeight:700,fontSize:14.5,color:"var(--t1)",letterSpacing:"-.01em"}}>Семейный бюджет</span>
          </div>
          <div className="sidebar-nav">
            {TAB_ITEMS.map(([id,ico,lb])=>(
              <button key={id} onClick={()=>setTab(id)} className={`sidebar-item${tab===id?" active":""}`}><span className="ico">{ico}</span>{lb}</button>
            ))}
          </div>
          <button onClick={()=>setStOpen(true)} className="sidebar-item"><span className="ico">⚙</span>Настройки</button>
        </nav>

        <div className="main">
      <header className="header">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="header-brand-mobile" style={{width:36,height:36,borderRadius:8,background:"var(--accent)",display:"grid",placeItems:"center"}}>
            <span style={{fontSize:18,filter:"brightness(10)"}}>💰</span>
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"var(--t1)",letterSpacing:"-.01em"}}>{TAB_ITEMS.find(t=>t[0]===tab)?.[2]||"Семейный бюджет"}</div>
            <div style={{fontSize:11,color:"var(--t3)",fontWeight:500,textTransform:"capitalize"}}>{moLabel}</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {data.members.map(m=>{const p=gp(m);const s=fM===m.id;
            return <button key={m.id} title={m.name} onClick={()=>setFM(fM===m.id?"all":m.id)} style={{width:32,height:32,borderRadius:8,background:s?p.accent:p.bg,color:s?"#fff":p.text,display:"grid",placeItems:"center",fontSize:11,fontWeight:700,border:"none",cursor:"pointer",transition:"all .2s"}}>{m.name.slice(0,2).toUpperCase()}</button>;
          })}
          <button onClick={()=>setAddOpen(true)} className="btn-add">+ Добавить</button>
          <button onClick={()=>setStOpen(true)} className="btn-icon mobile-tabs">⚙</button>
        </div>
      </header>

      <div className="main-inner">
      <div style={{padding:"14px 20px 6px",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <input type="month" value={fMo} onChange={e=>setFMo(e.target.value)} className="month-input"/>
        {fM!=="all"&&(()=>{const m=gm(fM),p=gp(m);return <span className="filter-badge" style={{background:p.bg,color:p.text}}>{m.name}<button onClick={()=>setFM("all")} style={{background:"none",border:"none",cursor:"pointer",color:p.text,fontSize:13,padding:0,marginLeft:4}}>✕</button></span>;})()}
      </div>
      <div className="mobile-tabs" style={{padding:"0 20px 12px",overflowX:"auto"}}>
        <div className="tab-bar">
          {TAB_ITEMS.map(([id,ico,lb])=>(
            <button key={id} onClick={()=>setTab(id)} className={`tab-btn${tab===id?" active":""}`}>{lb}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"0 20px"}} className="content">

        {tab==="dashboard"&&<div className="stack">
          <CurSwitcher/>
          {displayRate===null && <C$ style={{padding:"10px 16px",background:"var(--danger-soft)",color:"var(--danger)",fontSize:12}}>Нет курса для {dispCur} — добавьте покупку этой валюты на вкладке «Валюта», суммы показаны как есть.</C$>}
          <div className="grid3">
            <C$ className="stat-card"><div className="stat-label">Бюджет</div><div className="stat-value">{fmt(conv(data.budget))}<span className="stat-cur"> {dSym}</span></div><div style={{fontSize:11,color:"var(--t3)",marginTop:4}}>на месяц</div></C$>
            <C$ className="stat-card accent-card"><div className="stat-label" style={{color:"rgba(255,255,255,.7)"}}>Потрачено</div><div className="stat-value" style={{color:"#fff"}}>{fmt(conv(totE))}<span className="stat-cur"> {dSym}</span></div><div className="accent-badge">{bP}% бюджета</div></C$>
            <C$ className="stat-card"><div className="stat-label">Остаток</div><div className="stat-value" style={{color:rem>=0?"var(--accent)":"var(--danger)"}}>{fmt(conv(rem))}<span className="stat-cur"> {dSym}</span></div>{totI>0&&<div style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,marginTop:4,padding:"3px 8px",borderRadius:8,background:"var(--accent-soft)",color:"var(--accent)",fontWeight:600}}>↑ +{fmt(conv(totI))} доход</div>}</C$>
          </div>

          <C$><div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:600,color:"var(--t2)"}}>Использование бюджета</span><span style={{fontSize:14,fontWeight:800,color:over?"var(--danger)":warning?"#e07845":"var(--accent)"}}>{bP}%</span></div>
            <div style={{height:8,borderRadius:4,background:"var(--bg3)",overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,width:`${Math.min(bP,100)}%`,background:over?"var(--danger)":warning?"#e07845":"var(--accent)",transition:"width .7s ease"}}/></div>
          </C$>

          <EnvelopesCard categoryBudgets={data.categoryBudgets} catBD={catBD} conv={conv} dSym={dSym}/>

          {catBD.length>0&&<CategoryOverviewCard catBD={catBD} conv={conv} dSym={dSym}/>}

          {memBD.length>1&&<C$><div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:14}}>Кто сколько потратил</div>
            {memBD.map(m=>{const p=gpal(m,dark);return(
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
                <div style={{width:36,height:36,borderRadius:12,background:p.bg,color:p.text,display:"grid",placeItems:"center",fontWeight:700,fontSize:12,flexShrink:0}}>{m.name.slice(0,2).toUpperCase()}</div>
                <div style={{flex:1}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{m.name}</span><span style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>{fmt(conv(m.value))} {dSym} <span style={{fontWeight:500,color:"var(--t3)"}}>({pct(m.value,totE)}%)</span></span></div>
                  <div style={{height:4,borderRadius:2,background:"var(--bg3)"}}><div style={{height:"100%",borderRadius:2,width:`${pct(m.value,totE)}%`,background:m.color,transition:"width .6s"}}/></div>
                </div>
              </div>);})}
          </C$>}

          {dayData.some(d=>d.value>0)&&<C$><div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:12}}>По дням месяца</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:2,height:80}}>{dayData.map((d,i)=>{const mx=Math.max(...dayData.map(x=>x.value),1);return <div key={i} title={`${d.label}: ${fmt(conv(d.value))} ${dSym}`} style={{flex:1,height:`${Math.max(d.value/mx*100,3)}%`,background:d.value>0?"var(--accent)":"var(--bg3)",borderRadius:3,opacity:d.value>0?.8:.3,transition:"height .5s",minWidth:2,cursor:"default"}}/>;})}</div>
          </C$>}

          {!fil.length&&<C$ style={{textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12,opacity:.6}}>📝</div><div style={{color:"var(--t3)",fontSize:15,lineHeight:1.6}}>Нет записей за этот месяц<br/>Нажмите <b>+</b> чтобы добавить</div></C$>}
        </div>}

        {tab==="list"&&<div className="stack">
          {!sorted.length&&<C$ style={{textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12,opacity:.6}}>📋</div><div style={{color:"var(--t3)",fontSize:15}}>Нет записей</div></C$>}
          {(()=>{let last="";return sorted.map(e=>{
            const cat=CATS.find(c=>c.id===e.categoryId)||CATS[CATS.length-1];const m=gm(e.memberId);const p=m?gp(m):PAL[0];
            const sh=e.date!==last;last=e.date;
            const dl=new Date(e.date).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"});
            const cur=curInfo(e.currency||"RUB");
            const info=rubMap[e.id]||{};
            return(<div key={e.id}>
              {sh&&<div style={{fontSize:12,fontWeight:700,color:"var(--t3)",padding:"14px 2px 6px",textTransform:"capitalize"}}>{dl}</div>}
              <C$ onClick={()=>setEditExp(e)} style={{padding:"14px 16px",cursor:"pointer",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:44,height:44,borderRadius:14,background:cat.color+"18",display:"grid",placeItems:"center",fontSize:22,flexShrink:0}}>{cat.icon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:600,color:"var(--t1)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.desc||cat.name}{e.split?" · 👥":""}</div>
                    <div style={{fontSize:12,color:"var(--t3)",marginTop:2}}>{cat.name}{e.note?` — ${e.note}`:""}{info.insufficient?" · ⚠ не хватает купленной валюты":""}</div>
                  </div>
                  {m&&<div title={m.name} style={{width:28,height:28,borderRadius:10,background:p.bg,color:p.text,display:"grid",placeItems:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{m.name.slice(0,2).toUpperCase()}</div>}
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:16,fontWeight:800,whiteSpace:"nowrap",color:e.type==="income"?"var(--accent)":"var(--t1)"}}>{e.type==="income"?"+":"−"}{fmt(e.amount)} {cur.symbol}</div>
                    {e.currency!=="RUB"&&<div style={{fontSize:10,color:"var(--t3)"}}>{fmt(info.rub)} ₽</div>}
                  </div>
                </div>
              </C$>
            </div>);
          });})()}
        </div>}

        {tab==="currency"&&<CurrencyTab data={data} setData={setData}/>}

        {tab==="debts"&&<DebtsTab data={data} setData={setData} rubMap={rubMap} dark={dark}/>}

        {tab==="analytics"&&<div className="stack">
          <CurSwitcher/>
          <C$>
            <label style={LS}>Период</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:anPeriod==="custom"?12:0}}>
              {[["week","Неделя"],["month","Месяц"],["quarter","Квартал"],["year","Год"],["custom","Свой период"]].map(([v,l])=>(
                <button key={v} onClick={()=>setAnPeriod(v)} style={{padding:"8px 14px",borderRadius:11,border:anPeriod===v?"2px solid var(--accent)":"1.5px solid var(--border)",background:anPeriod===v?"var(--accent-soft)":"var(--input)",color:anPeriod===v?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{l}</button>
              ))}
            </div>
            {anPeriod==="custom" && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={LS}>С</label><CalendarPicker value={anCustomFrom} onChange={setAnCustomFrom}/></div>
              <div><label style={LS}>По</label><CalendarPicker value={anCustomTo} onChange={setAnCustomTo}/></div>
            </div>}
            <label style={{...LS,marginTop:14}}>Формат отображения</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {[["day","По дням"],["week","По неделям"],["month","По месяцам"]].map(([v,l])=>(
                <button key={v} onClick={()=>setAnFormat(v)} style={{padding:"8px 14px",borderRadius:11,border:anFormat===v?"2px solid var(--accent)":"1.5px solid var(--border)",background:anFormat===v?"var(--accent-soft)":"var(--input)",color:anFormat===v?"var(--accent)":"var(--t2)",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>{l}</button>
              ))}
            </div>
          </C$>

          <div className="grid2">
            <C$ className="stat-card"><div className="stat-label">Всего за период</div><div className="stat-value">{fmt(conv(anTotE))}<span className="stat-cur"> {dSym}</span></div></C$>
            <C$ className="stat-card"><div className="stat-label">В среднем за день</div><div className="stat-value">{fmt(conv(anTotE/anDays))}<span className="stat-cur"> {dSym}</span></div></C$>
          </div>

          {anBuckets.length>0 && <C$><div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:12}}>Динамика</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:anFormat==="day"?2:8,height:100,overflowX:"auto",paddingBottom:2}}>
              {anBuckets.map((b,i)=>{const mx=Math.max(...anBuckets.map(x=>x.value),1);
                return <div key={i} title={`${b.label}: ${fmt(conv(b.value))} ${dSym}`} style={{flex:"0 0 auto",width:anFormat==="day"?6:32,height:`${Math.max(b.value/mx*100,3)}%`,background:"var(--accent)",borderRadius:3,opacity:b.value>0?.8:.25,transition:"height .5s"}}/>;
              })}
            </div>
            {anFormat!=="day" && <div style={{display:"flex",gap:8,marginTop:6,fontSize:10,color:"var(--t3)"}}>{anBuckets.map((b,i)=><div key={i} style={{width:32,textAlign:"center"}}>{b.label}</div>)}</div>}
          </C$>}

          {anCatBD.length>0&&<C$><div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:14}}>Рейтинг категорий</div>
            {anCatBD.map((c,i)=>(<div key={c.id} style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
              <span style={{fontSize:13,fontWeight:800,color:"var(--t4)",width:22,textAlign:"right"}}>#{i+1}</span>
              <div style={{width:36,height:36,borderRadius:10,background:c.color+"18",display:"grid",placeItems:"center",fontSize:18,flexShrink:0}}>{c.icon}</div>
              <div style={{flex:1}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{c.name}</span><span style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>{fmt(conv(c.value))} {dSym} <span style={{fontWeight:500,color:"var(--t3)"}}>{pct(c.value,anTotE)}%</span></span></div>
                <div style={{height:6,borderRadius:3,background:"var(--bg3)"}}><div style={{height:"100%",borderRadius:3,width:`${pct(c.value,anTotE)}%`,background:c.color,transition:"width .6s"}}/></div>
              </div></div>))}
          </C$>}

          {anMemBD.length>1&&<C$><div style={{fontSize:14,fontWeight:700,color:"var(--t1)",marginBottom:14}}>Сравнение участников</div>
            <div style={{display:"flex",justifyContent:"center",marginBottom:12}}><Donut slices={anMemBD.map(m=>({value:conv(m.value),color:m.color}))} label={fmt(conv(anTotE))} sub={`${dSym} всего`} size={150}/></div>
            {anMemBD.map(m=>(<div key={m.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <div style={{width:10,height:10,borderRadius:4,background:m.color,flexShrink:0}}/><span style={{flex:1,fontSize:13,fontWeight:600,color:"var(--t1)"}}>{m.name}</span><span style={{fontSize:13,fontWeight:700,color:"var(--t1)"}}>{fmt(conv(m.value))} {dSym}</span><span style={{fontSize:11,color:"var(--t3)",width:35}}>{pct(m.value,anTotE)}%</span></div>))}
          </C$>}

          {!anCatBD.length&&<C$ style={{textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12,opacity:.6}}>📈</div><div style={{color:"var(--t3)",fontSize:15}}>Нет расходов за выбранный период</div></C$>}
        </div>}
      </div>
      </div>

      <button onClick={()=>setAddOpen(true)} className="fab">+</button>
        </div>
      </div>

      <Modal open={addOpen} onClose={()=>setAddOpen(false)} title="Новая запись">
        <ExpenseForm members={data.members} wallets={walletsList} defaultCurrency={data.settings?.defaultCurrency} onClose={()=>setAddOpen(false)} onSave={e=>setData(pr=>({...pr,expenses:[{...e,id:uid(),createdAt:Date.now()},...pr.expenses]}))}/>
      </Modal>
      <Modal open={!!editExp} onClose={()=>setEditExp(null)} title="Редактировать">
        {editExp&&<ExpenseForm members={data.members} wallets={walletsList} expense={editExp} defaultCurrency={data.settings?.defaultCurrency} onClose={()=>setEditExp(null)} onSave={e=>setData(pr=>({...pr,expenses:pr.expenses.map(x=>x.id===e.id?{...x,...e}:x)}))} onDelete={id=>setData(pr=>({...pr,expenses:pr.expenses.filter(x=>x.id!==id)}))}/>}
      </Modal>
      <Modal open={stOpen} onClose={()=>setStOpen(false)} title="Настройки">
        <Settings data={data} setData={setData} onClose={()=>setStOpen(false)} theme={theme} setTheme={setTheme}
          syncUrl={syncUrl} setSyncUrl={setSyncUrl} syncStatus={syncStatus}
          onSyncNow={async()=>{
            if(!syncUrl) return;
            setSyncStatus(s=>({...s,state:"syncing"}));
            try{
              const remoteRaw = await syncPull(syncUrl);
              if(remoteRaw && typeof remoteRaw==="object") setData(normalizeData(remoteRaw));
              syncReady.current = true;
              setSyncStatus({state:"ok",time:Date.now(),error:null});
            } catch(err){ setSyncStatus({state:"error",time:null,error:String(err.message||err)}); }
          }}/>
      </Modal>
    </div>
    </ThemeCtx.Provider>
  );
}

/* ═══ CSS ═══ */
const CSS=`
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg0:#F6F7F8; --bg1:#fff; --bg2:#FAFBFB; --bg3:#EEF0F2;
  --card:#fff; --card-sh:0 1px 2px rgba(16,24,40,.04);
  --input:#fff; --border:#E3E6EA;
  --t1:#171A1F; --t2:#5B6470; --t3:#8A93A0; --t4:#CBD1D8;
  --accent:#0B6E4F; --accent-soft:#E6F4EE; --accent-glow:rgba(11,110,79,.16);
  --danger:#B3392B; --danger-soft:#FBEBE8;
}
.dark {
  --bg0:#12151A; --bg1:#181C22; --bg2:#1D2129; --bg3:#262B34;
  --card:#181C22; --card-sh:0 1px 2px rgba(0,0,0,.3);
  --input:#1D2129; --border:#2B313B;
  --t1:#EDEFF2; --t2:#9BA3AF; --t3:#6E7684; --t4:#454C57;
  --accent:#28A57C; --accent-soft:rgba(40,165,124,.14); --accent-glow:rgba(40,165,124,.22);
  --danger:#D9695B; --danger-soft:rgba(217,105,91,.12);
}

*{box-sizing:border-box;margin:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
button{-webkit-tap-highlight-color:transparent;font-family:inherit;}
input:focus{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-glow) !important;outline:none;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes calOpen{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}

.app-shell{display:flex;min-height:100vh;}

/* — Боковая навигация (десктоп ≥900px), как в веб-версии Monarch — */
.sidebar{width:232px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:20px 14px;display:none;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--t2);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;}
.sidebar-item:hover{background:var(--bg2);}
.sidebar-item.active{background:var(--accent-soft);color:var(--accent);}
.sidebar-item .ico{font-size:16px;width:20px;text-align:center;}

.main{flex:1;min-width:0;}

.header{background:var(--card);padding:16px 24px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);transition:background .3s;}

.btn-icon{background:var(--bg2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:14px;color:var(--t2);display:grid;place-items:center;transition:background .2s;}
.btn-icon:hover{background:var(--bg3);}

.btn-primary{padding:11px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:14px;background:var(--accent);color:#fff;width:100%;font-family:inherit;transition:opacity .2s;}
.btn-primary:hover{opacity:.92;}

.btn-add{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--accent);color:#fff;font-family:inherit;transition:opacity .2s;white-space:nowrap;}
.btn-add:hover{opacity:.92;}

.month-input{padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--t1);font-size:13.5px;font-weight:600;font-family:inherit;transition:background .3s, color .3s;}
.month-input::-webkit-calendar-picker-indicator{filter:var(--t3);}

.filter-badge{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}

/* — Нижний таб-бар (мобайл <900px) — */
.tab-bar{display:inline-flex;gap:2px;background:var(--card);border-radius:10px;padding:3px;border:1px solid var(--border);transition:background .3s;}
.tab-btn{padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-weight:600;font-size:12.5px;white-space:nowrap;background:transparent;color:var(--t3);transition:all .2s;}
.tab-btn.active{background:var(--accent);color:#fff;}

.stack{display:flex;flex-direction:column;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}

.stat-card{position:relative;overflow:hidden;}
.stat-label{font-size:12px;font-weight:600;color:var(--t3);margin-bottom:8px;}
.stat-value{font-size:25px;font-weight:700;color:var(--t1);letter-spacing:-.01em;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat-cur{font-size:15px;font-weight:600;opacity:.55;}

.accent-card{background:var(--accent) !important;box-shadow:none !important;border-color:var(--accent) !important;}
.accent-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:4px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;}

.fab{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:10px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:26px;font-weight:400;box-shadow:0 4px 14px rgba(16,24,40,.18);display:grid;place-items:center;z-index:90;transition:transform .2s,box-shadow .2s;}
.fab:hover{transform:translateY(-2px);}
.fab:active{transform:scale(.95);}

.modal-box{border-radius:20px 20px 0 0;}
@media(min-width:640px){
  .modal-overlay{align-items:center !important;}
  .modal-box{border-radius:14px !important;max-height:85vh !important;}
}

@media(min-width:900px){
  .sidebar{display:flex;}
  .mobile-tabs{display:none !important;}
  .fab{display:none;}
  .main-inner{max-width:880px;margin:0 auto;padding:28px 32px 60px;}
}
@media(max-width:899px){
  .main-inner{padding:0;}
}
@media(max-width:480px){
  .stat-value{font-size:21px;}
  .grid3{grid-template-columns:1fr;}
  .header{padding:12px 16px;}
  .content{padding:0 16px !important;}
}
`;

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
